<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空の時計</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; font-family: system-ui, "Hiragino Sans", sans-serif; background: #000; }
  #sky { position: fixed; inset: 0; }
  #stars { position: absolute; inset: 0; opacity: 0; }
  .orb { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
  #sun { width: 22vmin; height: 22vmin; background: radial-gradient(circle, #fff1c9 0%, #ffb347 45%, #ff7a1a 100%); filter: blur(7px); box-shadow: 0 0 12vmin 6vmin rgba(255,150,40,.55); }
  #moon { width: 14vmin; height: 14vmin; background: radial-gradient(circle, #ffffff 0%, #dfe6ff 60%, #b9c4f0 100%); filter: blur(4px); box-shadow: 0 0 8vmin 3vmin rgba(200,215,255,.35); }
  #ground { position: absolute; left: 0; right: 0; bottom: 0; height: 18%; background: linear-gradient(to top, rgba(0,0,0,.35), rgba(0,0,0,0)); }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px)); text-align: center; transition: color .5s; }
  #clock { font-size: 2.4rem; font-weight: 300; letter-spacing: .08em; }
  #ui input { width: min(520px, 90%); margin-top: 8px; }
  button { margin-top: 8px; padding: 6px 14px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
</style>
</head>
<body>
<div id="sky">
  <canvas id="stars"></canvas>
  <div id="moon" class="orb"></div>
  <div id="sun" class="orb"></div>
  <div id="ground"></div>
</div>
<div id="ui">
  <div id="clock">--:--</div>
  <input id="slider" type="range" min="0" max="24" step="0.01" value="12">
  <div><button id="live">リアルタイムに戻す</button></div>
</div>
<script>
// [時刻, 空の上部色, 空の下部色]
const K = [
  [0,  [2,3,12],     [10,18,48]],
  [5,  [12,18,56],   [70,50,100]],
  [6.5,[110,130,190],[255,150,90]],   // 日の出
  [9,  [190,225,255],[255,255,255]],  // 昼は白に近く
  [15, [200,225,250],[255,255,255]],
  [17, [255,170,100],[255,235,200]],
  [18, [255,120,50], [255,190,110]],  // 夕方オレンジ
  [19.5,[70,45,95],  [220,100,90]],
  [21, [5,6,18],     [14,20,52]],
  [24, [2,3,12],     [10,18,48]]
];
const lerp = (a,b,t)=>a+(b-a)*t;
function colorAt(h, idx){
  for(let i=0;i<K.length-1;i++){
    const [h0,,]=K[i], [h1,,]=K[i+1];
    if(h>=h0 && h<=h1){
      const t=(h-h0)/(h1-h0), a=K[i][idx], b=K[i+1][idx];
      return a.map((v,j)=>lerp(v,b[j],t));
    }
  }
  return K[0][idx];
}
const rgb = c=>`rgb(${c.map(Math.round).join(",")})`;
const sky=document.getElementById('sky'), sun=document.getElementById('sun'), moon=document.getElementById('moon');
const stars=document.getElementById('stars'), ui=document.getElementById('ui');
const clock=document.getElementById('clock'), slider=document.getElementById('slider');
let live=true;

// 星を描く
function drawStars(){
  stars.width=innerWidth; stars.height=innerHeight;
  const g=stars.getContext('2d'); g.fillStyle='#fff';
  for(let i=0;i<120;i++){
    g.globalAlpha=0.3+Math.random()*0.7;
    g.beginPath(); g.arc(Math.random()*stars.width, Math.random()*stars.height*0.75, Math.random()*1.4+.3, 0, 7); g.fill();
  }
}
drawStars(); addEventListener('resize', ()=>{drawStars(); render(current());});

// 半円の軌道: tは0→1で左の地平線→頂点→右の地平線
function place(el, t){
  const w=innerWidth, h=innerHeight;
  const r=Math.min(w*0.44, h*0.55), cx=w/2, cy=h*0.82;
  el.style.left=(cx - Math.cos(Math.PI*t)*r)+'px';
  el.style.top =(cy - Math.sin(Math.PI*t)*r)+'px';
}
function current(){
  if(live){ const d=new Date(); return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600; }
  return parseFloat(slider.value);
}
function render(h){
  const top=colorAt(h,1), bot=colorAt(h,2);
  sky.style.background=`linear-gradient(to bottom, ${rgb(top)}, ${rgb(bot)})`;

  // 太陽: 6時〜18時
  const ts=(h-6)/12;
  if(ts>=-0.05 && ts<=1.05){
    place(sun, Math.min(1,Math.max(0,ts)));
    sun.style.opacity=Math.min(1, Math.min(ts+0.05, 1.05-ts)*10);
    // 地平線付近は赤みを強く、頂点付近は明るく
    const lift=Math.sin(Math.PI*Math.min(1,Math.max(0,ts)));
    sun.style.filter=`blur(7px) saturate(${1.3-lift*0.4})`;
  } else sun.style.opacity=0;

  // 月: 18時〜翌6時
  const hm=h<6?h+24:h, tm=(hm-18)/12;
  if(tm>=-0.05 && tm<=1.05){
    place(moon, Math.min(1,Math.max(0,tm)));
    moon.style.opacity=Math.min(1, Math.min(tm+0.05, 1.05-tm)*10)*0.95;
  } else moon.style.opacity=0;

  // 星: 夜だけ
  const night = h<5||h>21 ? 1 : h<6.5 ? (6.5-h)/1.5 : h>19.5 ? (h-19.5)/1.5 : 0;
  stars.style.opacity=night;

  // 文字色
  const lum=(0.3*bot[0]+0.59*bot[1]+0.11*bot[2]);
  ui.style.color = lum>140 ? '#222' : '#eee';

  const hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  clock.textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  if(live) slider.value=h;
}
slider.addEventListener('input', ()=>{ live=false; render(current()); });
document.getElementById('live').addEventListener('click', ()=>{ live=true; render(current()); });
setInterval(()=>{ if(live) render(current()); }, 1000);
render(current());
</script>
</body>
</html>
